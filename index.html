<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANJU 工作室 | 独立游戏开发</title>
    <style>
        /* 基础设置与暗黑渐变背景 */
        :root {
            --primary: #6e56cf;
            --bg-dark: #0f0f13;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #ededed;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(110, 86, 207, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.1), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 主容器 */
        .container {
            max-width: 800px;
            width: 100%;
        }

        /* 头部区域 */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .slogan {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-style: italic;
            letter-spacing: 2px;
        }

        /* 毛玻璃卡片通用样式 */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.3s ease, border-color 0.3s ease;
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
        }

        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.2s; }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: var(--primary);
            border-radius: 2px;
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        /* 游戏展示占位区 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .game-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* 按钮与链接 */
        .actions {
            display: flex;
            gap: 16px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 14px rgba(110, 86, 207, 0.4);
        }

        .btn-primary:hover {
            background-color: #5b45b0;
            box-shadow: 0 6px 20px rgba(110, 86, 207, 0.6);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* 页脚 */
        .footer {
            text-align: center;
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.85rem;
            animation: fadeIn 1s ease-out forwards;
            opacity: 0;
            animation-delay: 0.5s;
        }

        /* 动画效果 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .logo { font-size: 2.2rem; }
            .card { padding: 20px; }
            .actions { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头部 LOGO 与 Slogan -->
        <header class="header">
            <div class="logo">BANJU</div>
            <div class="slogan">开局已过，结局未至。</div>
        </header>

        <!-- 关于我们卡片 -->
        <section class="card">
            <h2>关于工作室</h2>
            <p>这里是 BANJU，一个专注于创造独特体验的独立游戏开发工作室。</p>
            <p>我们相信游戏不仅是娱乐，更是第九艺术。目前正在努力打磨我们的第一款作品，敬请期待。</p>
            <div class="actions">
                <!-- 已经为你修复了链接，指向你的 GitHub 主页 -->
                <a href="https://github.com/banju-stu" target="_blank" class="btn btn-primary">
                    <svg style="width:20px;height:20px;margin-right:8px;" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    访问 GitHub
                </a>
            </div>
        </section>

        <!-- 游戏作品展示卡片 -->
        <section class="card">
            <h2>我们的游戏</h2>
            <p>首个项目正在秘密开发中，后续将在此处展示。</p>
            <div class="game-grid">
                <div class="game-item">
                    <strong>Project: Banju</strong>
                    <br><br>
                    Coming Soon...
                </div>
                <!-- 你可以复制上面的 <div class="game-item"> 来添加更多游戏 -->
            </div>
        </section>

        <!-- 页脚版权信息 -->
        <footer class="footer">
            &copy; 2024 BANJU Studio. All Rights Reserved.
        </footer>
    </div>

</body>
</html>
